[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-social-sensing"
version = "0.1.0"
description = "Leakage-aware data and modeling pipeline for conference social sensing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "torch>=2.13",
  "torchvision>=0.28",
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "python-multipart>=0.0.20",
  "matplotlib>=3.11",
]

[project.scripts]
conference-build-dataset = "conference_social_sensing.data.build_dataset:main"
conference-split-dataset = "conference_social_sensing.data.split_dataset:main"
conference-build-group-crops = "conference_social_sensing.data.build_group_crops:main"
conference-run-baselines = "conference_social_sensing.baselines.run_baselines:main"
conference-train-group-model = "conference_social_sensing.modeling.train_group_model:main"
conference-predict-groups = "conference_social_sensing.modeling.predict_groups:main"
conference-serve-api = "conference_social_sensing.api.serve:main"

[tool.setuptools.packages.find]
where = ["src"]
